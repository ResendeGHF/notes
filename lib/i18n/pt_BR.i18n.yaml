login:
  title: Login
  form:
    agreeToPrivacyPolicy(rich): Ao fazer login, você concorda com a ${linkToPrivacyPolicy(Política de Privacidade)}.
  signup(rich): Ainda não tem uma conta? ${linkToSignup(Registre-se agora)}!
  notYou(rich): Não é você? ${undoLogin(Escolher outra conta)}.
  status:
    loggedOut: Desconectado
    tapToLogin: Toque para fazer login com o Nextcloud
    hi: Olá, $u!
    almostDone: Quase pronto para sincronização, toque para finalizar o login
    loggedIn: Logado com o Nextcloud
  ncLoginStep:
    whereToStoreData: "Escolha onde deseja armazenar seus dados:"
    saberNcServer: Servidor Nextcloud do Saber
    otherNcServer: Outro servidor Nextcloud
    serverUrl: URL do servidor
    loginWithSaber: Login com Saber
    loginWithNextcloud: Login com Nextcloud
    loginFlow:
      pleaseAuthorize: Por favor, autorize o Saber a acessar sua conta Nextcloud
      followPrompts: Por favor, siga as instruções na interface do Nextcloud
      browserDidntOpen: A página de login não abriu? Clique aqui
  encLoginStep:
    enterEncPassword: "Para proteger seus dados, digite sua senha de criptografia:"
    newToSaber: Novo no Saber? Basta digitar uma nova senha de criptografia.
    encPassword: Senha de criptografia
    encFaqTitle: Perguntas frequentes
    wrongEncPassword: A descriptografia falhou com a senha fornecida. Por favor, tente inseri-la novamente.
    connectionFailed: Algo deu errado ao conectar-se ao servidor. Por favor, tente novamente mais tarde.
    encFaq:
      -
        q: O que é uma senha de criptografia? Por que usar duas senhas?
        a: |-
          A senha do Nextcloud é usada para acessar a nuvem. A senha de criptografia "embaralha" seus dados antes que eles cheguem à nuvem.
          Mesmo que alguém obtenha acesso à sua conta do Nextcloud, suas notas permanecerão seguras e criptografadas com uma senha separada. Isso fornece uma segunda camada de segurança para proteger seus dados.
          Ninguém pode acessar suas notas no servidor sem sua senha de criptografia, mas isso também significa que se você esquecer sua senha de criptografia, perderá o acesso aos seus dados.
      -
        q: Ainda não defini uma senha de criptografia. Onde consigo uma?
        a: |-
          Escolha uma nova senha de criptografia e digite-a acima.
          O Saber gerará suas chaves de criptografia a partir desta senha automaticamente.
      -
        q: Posso usar a mesma senha da minha conta Nextcloud?
        a: Sim, mas tenha em mente que seria mais fácil para o administrador do servidor ou outra pessoa acessar suas notas se eles obtiverem acesso à sua conta Nextcloud.
profile:
  title: Meu perfil
  logout: Sair
  quotaUsage: Você está usando $used de $total ($percent%)
  connectedTo: Conectado a
  quickLinks:
    serverHomepage: Página inicial do servidor
    deleteAccount: Apagar conta
  faqTitle: Perguntas frequentes
  faq:
    -
      q: Eu perderei minhas notas se eu sair da minha conta?
      a: Não. Suas notas permanecerão tanto no seu dispositivo quanto no servidor. Elas não serão sincronizadas com o servidor até você fazer login novamente. Certifique-se de que a sincronização esteja concluída antes de sair para não perder nenhum dado (veja o progresso da sincronização na tela inicial).
    -
      q: Como altero minha senha do Nextcloud?
      a: Vá para o site do seu servidor e faça login. Então vá para Configurações > Segurança > Mudar senha. Você precisará sair e fazer login novamente no Saber após alterar sua senha.
    -
      q: Como altero minha senha de criptografia?
      a: |-
        0. Certifique-se de que a sincronização esteja concluída (veja o progresso da sincronização na tela inicial).
        1. Saia do Saber.
        2. Vá para o site do seu servidor e apague sua pasta 'Saber'. Isso apagará todas as suas notas do servidor.
        3. Faça login novamente no Saber. Você pode escolher uma nova senha de criptografia ao fazer login.
        4. Não se esqueça de sair e fazer login novamente no Saber em seus outros dispositivos também.
    -
      q: Como posso apagar minha conta?
      a: |-
        Toque no botão "@:profile.quickLinks.deleteAccount" acima e faça login se necessário.
        Se você estiver usando o servidor oficial do Saber, sua conta será apagada após um período de carência de 1 semana. Você pode entrar em contato comigo em adilhanney@disroot.org durante este período para cancelar a exclusão.
        Se você estiver usando um servidor de terceiros, pode não haver uma opção para apagar sua conta: você precisará consultar a política de privacidade do servidor para mais informações.
